<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day, Mailuv ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts in background */
        .floating-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.5rem;
            animation: float 6s infinite ease-in-out;
            user-select: none;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-20px) rotate(10deg); opacity: 1; }
            100% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
        }

        /* Main container */
        .card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            z-index: 10;
            border: 2px solid white;
            max-width: 500px;
            width: 90%;
        }

        /* CSS Heart (adapted from classic design) */
        .heart {
            width: 100px;
            height: 90px;
            position: relative;
            margin: 0 auto 20px;
            animation: heartbeat 1.2s infinite ease-in-out;
            cursor: pointer;
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            top: 0;
            width: 52px;
            height: 80px;
            border-radius: 50px 50px 0 0;
            background: #d44e4e;
        }

        .heart:before {
            left: 50px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.1); }
            35% { transform: scale(1.2); }
            45% { transform: scale(1.1); }
            55% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #b33b3b;
            font-size: 2.5rem;
            margin: 10px 0 5px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
        }

        p {
            color: #7a2e2e;
            font-size: 1.3rem;
            margin: 5px 0;
        }

        .message {
            background: rgba(255, 240, 240, 0.9);
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
            font-size: 1.2rem;
            color: #a13d3d;
            border: 1px solid #ffb6b6;
            display: none;
        }

        .message.show {
            display: block;
            animation: fadeIn 1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #fff;
            text-shadow: 1px 1px 2px #b33b3b;
        }
    </style>
</head>
<body>
    <!-- Generate floating hearts dynamically with JavaScript -->
    <div id="floating-hearts"></div>

    <div class="card">
        <div class="heart" id="mainHeart"></div>
        <h1>Happy Valentine's Day!</h1>
        <p>To my dearest love,</p>
        <p>You make my world complete.</p>

        <div class="message" id="loveMessage">
            💌 Every moment with you is special.<br>
            You are my today and all my tomorrows.<br>
            <span style="font-size:1.5rem;">❤️ I love you Emma.M ❤️</span>
        </div>

        <footer>click the heart 💖</footer>
    </div>

    <script>
        // Create floating hearts in background
        const heartsContainer = document.getElementById('floating-hearts');
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.top = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 2 + 1) + 'rem';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.animationDuration = (Math.random() * 5 + 4) + 's';
            heartsContainer.appendChild(heart);
        }

        // Show hidden message when heart is clicked
        const mainHeart = document.getElementById('mainHeart');
        const loveMessage = document.getElementById('loveMessage');

        mainHeart.addEventListener('click', function() {
            loveMessage.classList.toggle('show');
        });
    </script>
</body>
</html>
